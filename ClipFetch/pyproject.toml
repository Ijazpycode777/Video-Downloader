[project]
name = "clipfetch"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ijaz", email = "ijazi3485@gmail.com" }
]

requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "greenlet>=3.5.6",
    "imageio-ffmpeg>=0.7.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uuid>=1.30",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
]


[project.scripts]
clipfetch = "clipfetch:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
